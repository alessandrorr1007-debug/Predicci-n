services:
  - type: web
    name: prediccion-backend
    runtime: python
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
